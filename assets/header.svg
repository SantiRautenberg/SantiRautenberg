    <linearGradient id="line"><stop stop-color="#6a9ac4" stop-opacity="0"/><stop offset=".5" stop-color="#8eb9dd"/><stop offset="1" stop-color="#6a9ac4" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <g fill="none" stroke="#86a8c7" stroke-opacity=".18" stroke-width="1.5">
    <path d="M830 65 965 115 1110 70M965 115 1060 220 1160 170M830 65 855 215 965 115M855 215 1060 220"/>
  </g>
  <g fill="#92b8d8" fill-opacity=".55">
    <circle cx="830" cy="65" r="4"/><circle cx="965" cy="115" r="5"/><circle cx="1110" cy="70" r="4"/><circle cx="1060" cy="220" r="4"/><circle cx="1160" cy="170" r="3"/><circle cx="855" cy="215" r="4"/>
